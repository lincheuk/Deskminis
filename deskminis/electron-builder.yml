# M5 打包配置（决策点 1: electron-builder）
# 红线段：数据根 %APPDATA%/DeskMinis 不改、M3a 安全约束不放宽、MIGRATIONS 零改动。
appId: com.deskminis.app
productName: DeskMinis

# 复用本地 node_modules/electron/dist 作为打包用 Electron 二进制，避免 electron-builder 从 GitHub 下载
# （网络受限环境；本地 dist 即安装的 electron ^38，与 ABI 一致）。--dir 打包复制该目录即可。
electronDist: node_modules/electron/dist

# electron-vite 产物布局：out/main(out/main/index.js + minisd.js) / out/preload/index.cjs / out/renderer/
files:
  - 'out/**'
  - 'package.json'
  # resources/tray.png 需进 asar（main/index.ts 用 ../../resources/tray.png 相对回溯加载）
  - 'resources/**'

# 桥 stub 与 .cmd 垫片放安装目录 resources/（不进 asar，供 resolveBridgeCliPath/resolveBridgeNode 用 dirname(process.execPath) 回溯）。
# 注意 extraResources.to 相对 resources 目录，故不用 resources/ 前缀。
extraResources:
  - from: src/minisd/bridge-cli.mjs
    to: bridge-cli.mjs
  - from: scripts/bridge-node.cmd
    to: bridge-node.cmd

# 原生 .node 模块在 asar 内无法 require，解包到 app.asar.unpacked（硬阻塞 3）
asarUnpack:
  - 'node_modules/better-sqlite3/**'
  - 'node_modules/@napi-rs/keyring-win32-x64-msvc/**'

directories:
  output: dist

# 安装形态（决策点 2-4）：NSIS 安装包为主 + portable 免安装形态；命名规则（决策点 2-6）。
artifactName: 'DeskMinis-${version}-${name}.${ext}'
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  perMachine: false
  shortcutName: DeskMinis
  deleteAppDataOnUninstall: false
  artifactName: 'DeskMinis-${version}-Setup.${ext}'
portable:
  artifactName: 'DeskMinis-${version}-win-x64-portable.${ext}'

# 自动更新（用户 2026-08-11 拍板：GitHub Releases 全自动 + 启动检查可关）。
# electron-updater 靠这一段知道去哪查新版本；缺了它 checkForUpdates 直接报「找不到 publish 配置」。
#
# ⚠️ 仓库当前是 **private**：私有仓库的 Release 资产需要带 token 才能下载，
#    electron-updater 对私有源要求把 GH token 打进应用——**那等于把 token 发给每个用户**。
#    要真正跑通自动更新，二选一：① 仓库转 public；② 装机包换公开托管（另配 generic provider）。
#    此段先按 public 配置写好，转公开后即刻可用；保持 private 的话检查会 404，
#    主进程已按「静默吞掉」处理，不会打扰用户（见 src/main/index.ts 的 error 监听）。
publish:
  provider: github
  owner: lincheuk
  repo: Deskminis
