# M5 打包配置（决策点 1: electron-builder）
# 红线段：数据根 %APPDATA%/DeskMinis 不改、M3a 安全约束不放宽、MIGRATIONS 零改动。
appId: com.deskminis.app
productName: DeskMinis

# 复用本地 node_modules/electron/dist 作为打包用 Electron 二进制，避免 electron-builder 从 GitHub 下载
# （网络受限环境；本地 dist 即安装的 electron ^38，与 ABI 一致）。--dir 打包复制该目录即可。
electronDist: node_modules/electron/dist

# electron-vite 产物布局：out/main(out/main/index.js + minisd.js) / out/preload/index.cjs / out/renderer/
files:
  - 'out/**'
  - 'package.json'
  # resources/tray.png 需进 asar（main/index.ts 用 ../../resources/tray.png 相对回溯加载）
  - 'resources/**'

# 桥 stub 与 .cmd 垫片放安装目录 resources/（不进 asar，供 resolveBridgeCliPath/resolveBridgeNode 用 dirname(process.execPath) 回溯）。
# 注意 extraResources.to 相对 resources 目录，故不用 resources/ 前缀。
extraResources:
  - from: src/minisd/bridge-cli.mjs
    to: bridge-cli.mjs
  - from: scripts/bridge-node.cmd
    to: bridge-node.cmd
  # 许可随包（W1a-1）：安装包里要有本项目许可与第三方署名——MIT 要求副本附版权与许可声明，
  # Apache-2.0 §4(a)(d) 要求给接收者许可副本与署名，随包的 Noto 字体（OFL）也要求随附声明。
  # 原件在仓库根（工程目录的上一级），from 相对工程目录解析；LICENSE 改成 .txt，Windows 上双击就能打开。
  # electron-builder 对不存在的 from 只打警告、照样出包，所以 tests/license-consistency.test.ts 核对源文件确实存在。
  - from: ../LICENSE
    to: LICENSE.txt
  - from: ../THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md

# 原生 .node 模块在 asar 内无法 require，解包到 app.asar.unpacked（硬阻塞 3）
asarUnpack:
  - 'node_modules/better-sqlite3/**'
  - 'node_modules/@napi-rs/keyring-win32-x64-msvc/**'

directories:
  output: dist

# 安装形态（决策点 2-4）：NSIS 安装包为主 + portable 免安装形态；命名规则（决策点 2-6）。
artifactName: 'DeskMinis-${version}-${name}.${ext}'
win:
  # R2：应用/安装器图标（scripts/gen-app-icon.mjs 纯 node 生成，256 PNG-in-ICO；
  # 缺省时装出来是 Electron 默认图标——发布不过关点）
  icon: build/icon.ico
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  perMachine: false
  shortcutName: DeskMinis
  deleteAppDataOnUninstall: false
  artifactName: 'DeskMinis-${version}-Setup.${ext}'
portable:
  artifactName: 'DeskMinis-${version}-win-x64-portable.${ext}'

# 自动更新（用户 2026-08-11 拍板：GitHub Releases 全自动 + 启动检查可关）。
# electron-updater 靠这一段知道去哪查新版本；缺了它 checkForUpdates 直接报「找不到 publish 配置」。
#
# 更新源（2026-09-24 止血设计稿 §2 落定）：公开的、只放发布资产的仓库 lincheuk/deskminis-releases，由用户在 GitHub 上创建。
# 为什么不是源码仓：源码仓是私有的，私仓的 Release 资产要带 token 才能下载，把 token 打进应用等于发给每个用户；
# 0.1.1 写死的就是私仓，检查永远 404，那批用户只能手动装一次 0.3.0。
# 这一段在打包时写进安装目录的 resources/app-update.yml，装到用户机器上就改不了——日后换源，只能先在旧源发一个带新配置的过渡版。
# github provider 走 github.com 的 releases.atom 与 /releases/latest 两个网页端点：不走 API、不吃 API 限流、不要 token。
# 发布要求见 docs/RELEASE.md §4：Release 不能是 draft / prerelease，tag 用 v<版本>，latest.yml 与 Setup.exe.blockmap 一并上传。
# 便携版包里也带着这份配置，但主进程认出便携版就不检查（src/main/update-status.ts 的 isPortableBuild）。
# src/main/update-status.ts 的 RELEASES_PAGE_URL 与这里同一个 owner/repo，改源时两边一起改（tests/update-error-text.test.ts 核对）。
publish:
  provider: github
  owner: lincheuk
  repo: deskminis-releases
